name: Build and Release ModernChickens

on:
  push:
    branches:
      - "Neo/1.21.1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ModernChickens
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Read ModernChickens version
        id: version
        shell: bash
        run: |
          minecraft_version="$(awk -F= '$1 == "minecraft_version" { print $2; exit }' gradle.properties | tr -d '\r')"
          mod_version="$(awk -F= '$1 == "mod_version" { print $2; exit }' gradle.properties | tr -d '\r')"
          tag_lanzador="$(awk -F= '$1 == "tag_lanzador" { print $2; exit }' gradle.properties | tr -d '\r')"
          mod_name="$(awk -F= '$1 == "mod_name" { print $2; exit }' gradle.properties | tr -d '\r')"
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${mod_version}" >> "$GITHUB_OUTPUT"
          echo "jar=build/libs/${mod_name}-${minecraft_version}-${mod_version}-${tag_lanzador}.jar" >> "$GITHUB_OUTPUT"

      - name: Build ModernChickens
        run: ./gradlew clean build --no-daemon --console=plain

      - name: Verify ModernChickens JAR
        run: |
          test -f "${{ steps.version.outputs.jar }}"
          echo "Built ${{ steps.version.outputs.jar }}"

      - name: Check for existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.release_tag }}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${{ steps.version.outputs.release_tag }} already exists; skipping release creation."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish ModernChickens latest release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.release_tag }}" \
            "${{ steps.version.outputs.jar }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "ModernChickens ${{ steps.version.outputs.mod_version }}" \
            --generate-notes \
            --latest
