name: Build and Release

on:
  push:
    branches:
      - "Forge/1.20.1"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Read Version
        id: gradle_props
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          echo "mod_version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_version=${VERSION}-build.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Create Tag
        run: |
          git tag v${{ steps.gradle_props.outputs.release_version }}
          git push origin v${{ steps.gradle_props.outputs.release_version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.gradle_props.outputs.release_version }}
          name: ModernChickens ${{ steps.gradle_props.outputs.release_version }}
          generate_release_notes: true
          files: |
            build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishes the jar to CurseForge only when the pushed commit message contains [curseforge], optionally with a
      # release type: [curseforge], [curseforge beta] or [curseforge alpha]. Needs the CURSEFORGE_TOKEN secret and the
      # CURSEFORGE_PROJECT_ID variable of the repository.
      - name: Publish to CurseForge
        if: ${{ contains(github.event.head_commit.message, '[curseforge') }}
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          MOD_VERSION: ${{ steps.gradle_props.outputs.mod_version }}
          CURSEFORGE_PATCHOULI_SLUG: ${{ vars.CURSEFORGE_PATCHOULI_SLUG || 'patchouli' }}
        run: |
          set -euo pipefail
          if [[ ! "$CURSEFORGE_PATCHOULI_SLUG" =~ [a-z] ]]; then CURSEFORGE_PATCHOULI_SLUG="patchouli"; fi
          if [ -z "$CURSEFORGE_TOKEN" ]; then echo "::error::Falta el secret CURSEFORGE_TOKEN en el repositorio"; exit 1; fi
          if [ -z "$CURSEFORGE_PROJECT_ID" ]; then echo "::error::Falta la variable CURSEFORGE_PROJECT_ID en el repositorio"; exit 1; fi
          MC="1.20.1"
          JAVA_NAME="Java 17"

          RELEASE_TYPE=release
          if [[ "$COMMIT_MESSAGE" =~ \[curseforge\ (alpha|beta|release)\] ]]; then RELEASE_TYPE="${BASH_REMATCH[1]}"; fi

          # The changelog section of this mod version, or a plain line when it has none
          CHANGELOG=$(awk -v v="$MOD_VERSION" '/^# /{ if (found) exit; if (index($0, "# [" v "]") == 1) found=1 } found' CHANGELOG.md)
          [ -n "$CHANGELOG" ] || CHANGELOG="Modern Chickens $MOD_VERSION for Minecraft $MC."

          # A jar that is already on CurseForge (marked with a tag once it was uploaded) is not uploaded again
          tag="curseforge-forge-$MC-$MOD_VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "Forge $MC $MOD_VERSION is already on CurseForge (tag $tag), not uploading it again"
            exit 0
          fi

          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)

          VERSIONS=$(curl -sS -H "X-Api-Token: $CURSEFORGE_TOKEN" "https://minecraft.curseforge.com/api/game/versions" || true)
          if echo "$VERSIONS" | jq -e --arg j "$JAVA_NAME" 'any(.[]; .name == $j)' > /dev/null 2>&1; then
            GAME_VERSIONS=$(jq -nc --arg mc "$MC" --arg j "$JAVA_NAME" '[$mc, "Forge", "Client", "Server", $j]')
          else
            echo "::warning::CurseForge no conoce la version '$JAVA_NAME', se sube sin ella"
            GAME_VERSIONS=$(jq -nc --arg mc "$MC" '[$mc, "Forge", "Client", "Server"]')
          fi
          metadata=$(jq -nc \
            --arg changelog "$CHANGELOG" \
            --arg type "$RELEASE_TYPE" \
            --arg name "ModernChickens-$MC-$MOD_VERSION-Forge" \
            --argjson versions "$GAME_VERSIONS" \
            --arg dep "$CURSEFORGE_PATCHOULI_SLUG" \
            '{changelog: $changelog, changelogType: "markdown", releaseType: $type, displayName: $name,
              gameVersionNames: $versions,
              relations: {projects: [{slug: $dep, type: "requiredDependency"}]}}')

          echo "Uploading $jar to CurseForge as a $RELEASE_TYPE for Forge $MC"
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            "https://minecraft.curseforge.com/api/projects/$CURSEFORGE_PROJECT_ID/upload-file" \
            -H "X-Api-Token: $CURSEFORGE_TOKEN" \
            --form-string "metadata=$metadata" -F "file=@$jar")
          cat response.json
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::CurseForge respondio HTTP $status: $(tr -d '\n' < response.json)"
            exit 1
          fi
          git tag "$tag"
          git push origin "$tag"
